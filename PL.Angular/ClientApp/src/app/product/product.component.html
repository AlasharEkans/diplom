<div class="container mt-4">
  <h2 class="mb-4">Доступні навчальні курси</h2>
  <div class="row">
    <div class="col-md-4 mb-4" *ngFor="let course of courses">
      <div class="card h-100 shadow-sm">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ course.title }}</h5>
          <p class="card-text text-muted mb-2">Автор: {{ course.author }}</p>
          <p class="card-text flex-grow-1">{{ course.description }}</p>
          <button class="btn btn-primary w-100 mt-3" (click)="enroll(course.id)">
            Подати заявку на курс
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
