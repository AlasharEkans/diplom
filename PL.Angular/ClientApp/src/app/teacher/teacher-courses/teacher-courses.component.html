<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>Управління курсами</h2>
    <button class="btn btn-success" (click)="startCreate()" *ngIf="showList">
      + Додати курс
    </button>
  </div>

  <app-course-form
    *ngIf="isCreating || editingCourse"
    [course]="editingCourse"
    [userId]="userId!"
    (saved)="onSaved()"
    (cancelled)="onCancelled()">
  </app-course-form>

  <ng-container *ngIf="showList">
    <div class="alert alert-info" *ngIf="courses.length === 0">
      Курсів ще немає. Натисніть «Додати курс», щоб створити перший.
    </div>
    <div class="row">
      <div class="col-md-4 mb-4" *ngFor="let course of courses">
        <div class="card h-100 shadow-sm">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title">{{ course.title }}</h5>
            <p class="card-text text-muted mb-1">Автор: {{ course.author }}</p>
            <p class="card-text flex-grow-1">{{ course.description }}</p>
          </div>
          <div class="card-footer d-flex gap-2">
            <button class="btn btn-outline-primary btn-sm flex-fill" (click)="startEdit(course)">
              Редагувати
            </button>
            <button class="btn btn-outline-danger btn-sm flex-fill" (click)="deleteCourse(course.id)">
              Видалити
            </button>
          </div>
        </div>
      </div>
    </div>
  </ng-container>
</div>
