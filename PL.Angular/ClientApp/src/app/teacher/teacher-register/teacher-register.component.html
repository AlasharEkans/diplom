<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h3 class="mb-4">Реєстрація викладача</h3>
      <div class="alert alert-danger" *ngIf="error">{{ error }}</div>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-3">
          <label class="form-label">Email *</label>
          <input class="form-control" type="email" formControlName="email" />
          <div class="text-danger small" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
            Введіть коректний email
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">Пароль *</label>
          <input class="form-control" type="password" formControlName="password" />
        </div>
        <div class="mb-3">
          <label class="form-label">Ім'я</label>
          <input class="form-control" type="text" formControlName="firstName" />
        </div>
        <div class="mb-3">
          <label class="form-label">Прізвище</label>
          <input class="form-control" type="text" formControlName="lastName" />
        </div>
        <div class="mb-3">
          <label class="form-label">Код доступу викладача *</label>
          <input class="form-control" type="password" formControlName="accessCode" />
          <div class="form-text text-muted">Отримайте у адміністратора платформи</div>
        </div>
        <button class="btn btn-primary w-100" type="submit" [disabled]="form.invalid">
          Зареєструватись як викладач
        </button>
        <div class="text-center mt-3">
          <a routerLink="/register">Реєстрація студента</a>
          &nbsp;|&nbsp;
          <a routerLink="/login">Вхід</a>
        </div>
      </form>
    </div>
  </div>
</div>
